name: WatchPilot research validation

on:
  push:
    branches:
      - "feat/watchpilot-*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: WatchPilot tests (no API credentials)
        run: npm run test:watchpilot
      - name: TypeScript check
        run: npm run type-check
      - name: ESLint
        run: npm run lint
      - name: Next.js production build (no private credentials)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          MOVIE_DB_API_KEY: ""
        run: npm run build

  browser-smoke:
    name: Browser E2E (Chromium, no API credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned browser test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real browser tests against local Next.js
        env:
          CI: "true"
          MOVIE_DB_API_KEY: ""
          TYPESAFE_API_KEY: ""
          WATCHPILOT_ENABLE_JEV: "0"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --config=tests/e2e/playwright.config.mjs
      - name: Upload browser trace and screenshots on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watchpilot-e2e-failure
          path: |
            tests/e2e/report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
